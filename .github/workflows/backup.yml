name: Nightly backup

on:
  # Enable the schedule once atlas-production and atlas-backups-production exist.
  # schedule:
  #   # 18:10 UTC = 02:10 Malaysia time
  #   - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to back up"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Export production D1
        run: npx wrangler d1 export atlas-$TARGET --remote --env $TARGET --output backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Compress
        run: |
          test -s backup.sql
          gzip -9 backup.sql
          ls -lh backup.sql.gz

      - name: Upload to the backup bucket
        run: |
          KEY="backups/$(TZ=Asia/Kuala_Lumpur date +%Y/%m/%d).sql.gz"
          npx wrangler r2 object put "atlas-backups-$TARGET/$KEY" \
            --file backup.sql.gz \
            --content-type application/gzip \
            --remote
          echo "Uploaded $KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove the plain export
        if: always()
        run: rm -f backup.sql backup.sql.gz
